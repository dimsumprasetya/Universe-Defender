function hBlackHole(g,f){

  for(let y=0;y<30;y++){const w=y<6?0:(y<18?1:0),a=((y+f*2)%5)<3;if(a){put(C-w,y+2,'#7a50d8');put(C+w,y+2,'#7a50d8');if(y>8)put(C,y+2,'#d8c0ff');}}

    const dx=x-C,dy=y-C,d=Math.hypot(dx,dy);
    const u=dx*ct+dy*st,v=-dx*st+dy*ct,rho=Math.hypot(u,v/.27),ang=Math.atan2(v/.27,u);

    const behind=v<0;

    }

}

let WP=[],pathCell=new Set();
function buildPath(w){
  WP=w.map(p=>[p[0]*T+T/2,p[1]*T+T/2]);pathCell=new Set();
  for(let i=0;i<WP.length-1;i++){
    const a=WP[i],b=WP[i+1];
    const ac=Math.round((a[0]-T/2)/T),ar=Math.round((a[1]-T/2)/T),bc=Math.round((b[0]-T/2)/T),br=Math.round((b[1]-T/2)/T);
    const dc=Math.sign(bc-ac),dr=Math.sign(br-ar);let c=ac,r=ar;
    while(true){pathCell.add(c+','+r);if(c===bc&&r===br)break;c+=dc;r+=dr;}
  }
}

/* ---------- update ---------- */
function update(dt){

    S.spawnT-=dt;

      const t=S.queue.shift();if(ENEMY_DEF[t].boss)S.bossIntroDone=false;spawn(t);S.spawnT=ENEMY_DEF[t].boss?2.2:Math.max(ENDLESS&&S.wave>25?Math.max(.18,.35-.004*(S.wave-25)):.35,.8-S.wave*.015);}
  }

    if(e.regenL>0){const q=Math.min(e.regenL,dt);e.regenL-=q;e.hp=Math.min(e.max,e.hp+e.regenR*q);if(Math.random()<dt*12)part(e.x+(Math.random()-.5)*30,e.y+(Math.random()-.5)*30,'#7aff7a',1,{spd:10,spdR:20,life:.4,sz:3});}
    let sp=e.spd;if(e.slowT>0){e.slowT-=dt;sp*=(e.charge>0?Math.min(1,e.slowF+.3):e.slowF);}
    {let mu=(e.frenzy>0?1.3:1)*(e.haste>0?1.25:1)*(e.charge>0?1.8:1);if(d.boss){mu=Math.min(mu,1.8);if(WP&&e.seg>=WP.length-3)mu=1;}sp*=mu;}
    e.anim+=dt*d.afps*(e.slowT>0?e.slowF:1);

    let mv=sp*dt,stopE=false;
    const A=d.atk;
    if(A){

        let tg=e.tgt;if(!tg||tg.dead||Math.hypot(tg.x-e.x,tg.y-e.y)>A.r+8)tg=e.tgt=nearestTower(e,A.r);
        if(tg){stopE=true;e.atkCd-=dt;if(e.atkCd<=0){e.atkCd=A.rate;e.swing=.25;hitTower(tg,e.dmg);}}
      }else if(A.mode==='ranged'){

      }else if(A.mode==='kamikaze'){

  const col=(e)=>{const sv=runs[rk(i,e)];
    return '<div class="mode"><b style="color:'+(e?'#ff9a3a':'#7aff7a')+'">'+(e?'∞ ENDLESS':'NORMAL · 25 GEL')+'</b><small>'+(e?'Gelombang tanpa akhir, makin ganas. Boss berulang. ◆ tiap 10 gelombang. Rekor: '+(best[d.id+'_e']||0):'Tamatkan 25 gelombang untuk dapat permata. Terbaik: '+(best[d.id]||0))+'</small>'
     +(sv?'<button class="btn go" data-a="r'+(e?1:0)+'">▶ LANJUT GEL '+(sv.wave+1)+'</button><button class="btn" data-a="n'+(e?1:0)+'">↻ MULAI BARU</button>':'<button class="btn go" data-a="n'+(e?1:0)+'">▶ MULAI</button>')+'</div>';};
  o.innerHTML='<h1 style="color:'+d.accent+'">'+d.name+'</h1><div id="modes">'+col(0)+col(1)+'</div><button class="btn" id="rsB">← KEMBALI</button>';
  o.querySelectorAll('.mode button').forEach(b=>b.onclick=()=>{const a=b.dataset.a,e=a[1]==='1';if(a[0]==='r')resumeDungeon(i,e);else{clearRun(i,e);startDungeon(i,e);}});
  $('rsB').onclick=showSelect;
}
function showSelect(){
  const o=$('overlay');o.style.display='flex';const best=loadBest(),runs=loadRuns();
  const gm=loadGem();
  let h='<h1>UNIVERSE DEFENDER</h1><div class="gembar"><span>◆ '+gm.gems+' PERMATA</span><button class="btn" id="shopB" style="border-color:#6ae8ff;color:#6ae8ff">POWERUP</button><button class="btn" id="colB" style="border-color:#ffd23b;color:#ffd23b">🃏 KOLEKSI KARTU</button><button class="btn" id="hsB" style="border-color:#52d86e;color:#52d86e">🏆 HIGHSCORE</button></div><p class="intro">Pilih dungeon. Makin ke kanan makin sulit, boss muncul tiap 5 gelombang. Waspada: musuh perusak bisa menghancurkan menaramu. Perbaiki menara yang rusak!</p><div id="cards">';
  DUNGEONS.forEach((d,i)=>{const b=best[d.id]||0;let pips='';for(let k=1;k<=6;k++)pips+='<i'+(k<=d.lvl?' class="on"':'')+'></i>';
    h+='<button class="card" data-i="'+i+'" style="--c:'+d.accent+'"><b>'+d.name+'</b><span class="pips">'+pips+'</span><small>'+d.sub+'</small><small class="bl">BOS: '+d.bosses.map(x=>x.name).join(' · ')+'</small><em>'+(b>=25?'✔ TAMAT':b?'Terbaik: gel '+b+'/25':'Belum dicoba')+'</em>'+(best[d.id+'_e']?'<em style="color:#ff9a3a">∞ Endless: gel '+best[d.id+'_e']+'</em>':'')+(runs[i]||runs['e'+i]?'<u class="sv">▶ ADA PROGRES TERSIMPAN</u>':'')+'</button>';});
  o.innerHTML=h+'</div><div class="gembar" style="gap:6px"><button class="btn" id="expB">SALIN KODE SIMPAN</button><button class="btn" id="impB">MUAT KODE</button></div>';
  o.querySelectorAll('.card').forEach(el=>el.onclick=()=>askMode(+el.dataset.i));
  $('shopB').onclick=showShop;$('colB').onclick=()=>window.openGallery();$('hsB').onclick=()=>showHS();$('hsBtn').onclick=()=>showHS(-1,'g',true);
  $('expB').onclick=()=>{const c=exportCode();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('KODE SIMPAN TERSALIN',2000),()=>{prompt('Salin kode simpan ini:',c);});};
  $('impB').onclick=()=>{const c=prompt('Tempel kode simpan:');if(!c)return;try{importCode(c);toast('PROGRES DIMUAT',2000);showSelect();}catch(e){toast('KODE TIDAK VALID',2000);}};
}
function showShop(){
  const o=$('overlay');o.style.display='flex';const g=loadGem();
  let h='<h1 style="color:#6ae8ff">◆ POWERUP</h1><p>Tamatkan dungeon untuk mendapat permata. Powerup berlaku permanen di semua dungeon.</p><div class="gembar"><span>◆ '+g.gems+' PERMATA</span></div><div id="ups">';
  UPS.forEach(u=>{const lv=g.up[u.k]||0,full=lv>=u.max,c=full?0:u.cost[lv];let pips='';for(let i=0;i<u.max;i++)pips+='<i'+(i<lv?' class="on"':'')+'></i>';
    h+='<div class="up"><div><b>'+u.n+'</b><span class="pips">'+pips+'</span><small>'+u.d+'</small></div><button class="btn'+(full?'':' go')+'" data-k="'+u.k+'"'+(full||g.gems<c?' disabled':'')+'>'+(full?'MAKS':'◆ '+c)+'</button></div>';});
  o.innerHTML=h+'</div><button class="btn" id="shopBack">← KEMBALI</button>';
  o.querySelectorAll('.up button').forEach(b=>b.onclick=()=>{const g2=loadGem(),u=UPS.find(x=>x.k===b.dataset.k),lv=g2.up[u.k]||0;
    if(lv>=u.max||g2.gems<u.cost[lv])return;g2.gems-=u.cost[lv];g2.up[u.k]=lv+1;saveGem(g2);refreshUp();beep(700,.1,'triangle',.06);beep(1000,.15,'triangle',.06);showShop();});
  $('shopBack').onclick=showSelect;
}
function startDungeon(i,e){
  ENDLESS=!!e;
  if(!sound.ac){try{sound.ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  loadDungeon(i);reset();$('overlay').style.display='none';beep(440,.1,'square',.05);beep(660,.2,'square',.05);
}
$('menuBtn').onclick=showSelect;

/* ---------- fit & fullscreen ---------- */
const stageEl=$('stage');
function fit(){
  const w=stageEl.clientWidth,h=stageEl.clientHeight;if(!w||!h)return;
  let k=Math.min(w/W,h/H);if(k>=1)k=Math.floor(k);cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px';
}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));
document.addEventListener('fullscreenchange',()=>setTimeout(fit,150));
if(window.ResizeObserver)new ResizeObserver(fit).observe(stageEl);
fit();
$('fsBtn').onclick=async()=>{
  const el=document.documentElement;
  try{
    if(document.fullscreenElement){await document.exitFullscreen();}
    else{await (el.requestFullscreen||el.webkitRequestFullscreen).call(el);try{await screen.orientation.lock('landscape');}catch(e){}}
  }catch(e){toast('FULLSCREEN DIBLOKIR DI SINI — LAYAR SUDAH PENUH, PUTAR HP KE LANDSCAPE',2800);}
};

/* ---------- loop ---------- */
setInterval(saveRun,3000);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});window.addEventListener('pagehide',saveRun);
document.addEventListener('pointerdown',function f(){document.removeEventListener('pointerdown',f);try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{});}catch(e){}},{once:true});

/* ---------- SFX klik menu (berat & sinematik) ---------- */
const SFX=(function(){let nb=null;
 const ac=()=>(sound.on&&sound.ac&&sound.ac.state!=='closed')?sound.ac:null;
 function nbuf(a){if(!nb){const l=a.sampleRate*.6|0;nb=a.createBuffer(1,l,a.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<l;i++)d[i]=Math.random()*2-1;}return nb;}
 function osc(a,t,type,f0,f1,dur,vol,lp){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);let n=o;if(lp){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(lp[0],t);f.frequency.exponentialRampToValueAtTime(lp[1],t+dur);o.connect(f);n=f;}n.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}
 function nz(a,t,dur,vol,type,f0,f1){const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();s.buffer=nbuf(a);f.type=type;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+.02);}
 return {play(k){const a=ac();if(!a)return;const t=a.currentTime+.005;
  const tone=(f0,f1,d,v,ty)=>osc(a,t,ty||'sine',f0,f1,d,v,[2600,700]);
  if(k==='click'){tone(760,560,.09,.1,'triangle');osc(a,t,'sine',300,190,.07,.09);nz(a,t,.03,.025,'bandpass',1400,1000);try{MUS.duck(140);}catch(e){}}
  else if(k==='card'){tone(620,900,.12,.1,'triangle');osc(a,t+.05,'sine',930,1180,.1,.07,[2600,900]);osc(a,t,'sine',260,170,.09,.09);try{MUS.duck(180);}catch(e){}}
  else if(k==='back'){tone(700,430,.13,.1,'triangle');osc(a,t,'sine',250,150,.1,.08);try{MUS.duck(150);}catch(e){}}
  else if(k==='go'){nz(a,t,.4,.05,'lowpass',600,2200);[523,659,784,1047].forEach((f,i)=>osc(a,t+i*.07,'triangle',f,f,.32,.075,[2400,900]));osc(a,t,'sine',130,70,.3,.12);try{MUS.duck(520);}catch(e){}}
 }};})();
document.addEventListener('click',e=>{
  const el=e.target.closest&&e.target.closest('button,.card,.gg');if(!el||el.disabled)return;
  const t=(el.textContent||'').toUpperCase();
  if(el.classList.contains('card')||el.classList.contains('gg'))SFX.play('card');
  else if(el.id==='homeGo'||/^\s*▶?\s*MULAI/.test(t)||el.id==='waveBtn')SFX.play('go');
  else if(/KEMBALI|TUTUP|BATAL|←/.test(t))SFX.play('back');
  else SFX.play('click');
},true);
/* sisi kiri/kanan & HUD hanya tampil di dalam dungeon */
(function(){const app=document.getElementById('app'),ov=document.getElementById('overlay');
  function upd(){const menu=ov.style.display==='flex'&&!ov.querySelector('#again');app.classList.toggle('mm',menu);}
  new MutationObserver(upd).observe(ov,{attributes:true,attributeFilter:['style'],childList:true});upd();})();
loadDungeon(0);reset();showSelect();
(function(){const hm=document.getElementById('home');if(!hm)return;let done=false;const hint=hm.querySelector('.hblink');
function wake(){try{if(!sound.ac||sound.ac.state==='closed')sound.ac=new (window.AudioContext||window.webkitAudioContext)();if(sound.ac.state!=='running')sound.ac.resume();}catch(e){}}
function go(){if(done)return;const fin=()=>{if(done)return;done=true;wake();SFX.play('go');hm.style.display='none';};if(!getNick()){nickModal(fin);return;}fin();}
function press(){wake();if(!MUS.isOn()||MUS.themeOn()){go();return;}
  let p;try{p=MUS.playTheme();}catch(e){}
  if(p&&p.then)p.then(()=>{if(hint)hint.textContent='KETUK LAGI UNTUK MASUK';},()=>go());else go();}
try{wake();}catch(e){}
if(hint)hint.textContent='KETUK UNTUK MULAI';
hm.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#homeGo')){wake();go();return;}press();});
['click','touchend','pointerup'].forEach(ev=>hm.addEventListener(ev,wake,{passive:true}));
window.addEventListener('keydown',e=>{if(!done&&(e.key==='Enter'||e.key===' ')){e.preventDefault();press();}});
setInterval(()=>{if(!done&&MUS.themeOn()&&hint)hint.textContent='KETUK ATAU TEKAN ENTER';},400);})();
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S.dialog){dlgTick(dt);}
  else if(!S.paused&&!S.over&&$('overlay').style.display!=='flex'){for(let i=0;i<S.speed;i++)update(dt);}
  if(S.sel&&!S.paused){const u=$('upB');if(u)u.disabled=S.gold<upCost(S.sel);const hv=$('hpv');if(hv)hv.textContent=Math.ceil(S.sel.hp)+'/'+S.sel.max;const rb=$('repB');if(rb){rb.textContent='PERBAIKI ('+repCost(S.sel)+')';rb.disabled=S.gold<repCost(S.sel);}}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
